<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { max-width: 950px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 13px; margin-top: 3px; }
        .alert-success { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-save { background: #28a745; color: white; font-size: 15px; }
        .btn-edit { background: #007bff; color: white; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-size: 13px; }
        .btn-delete { background: #dc3545; color: white; padding: 5px 10px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #343a40; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h1>Employee Management System</h1>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <h2>Add New Employee</h2>
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" th:field="*{fullName}" placeholder="Enter full name">
            <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" th:field="*{email}" placeholder="Enter email">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label>Phone (10 digits):</label>
            <input type="text" th:field="*{phone}" placeholder="0771234567">
            <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="form-group">
            <label>Department:</label>
            <input type="text" th:field="*{department}" placeholder="Enter department">
            <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>

        <div class="form-group">
            <label>Salary:</label>
            <input type="number" step="0.01" th:field="*{salary}" placeholder="Enter salary">
            <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
        </div>

        <button type="submit" class="btn-save">Save Employee</button>
    </form>

    <h2>Employee List (Total: <span th:text="${#lists.size(employees)}">0</span>)</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.fullName}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.phone}"></td>
            <td th:text="${emp.department}"></td>
            <td th:text="${emp.salary}"></td>
            <td>
                <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn-edit">Edit</a>
                <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('Are you sure you want to delete this employee?');">
                    <button type="submit" class="btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
